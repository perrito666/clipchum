name: Release

on:
  push:
    tags: ["v*"]

# The release step publishes with the built-in GITHUB_TOKEN via the gh
# CLI the runner ships — no third-party release action to pin or trust.
permissions:
  contents: write

# Cost note: macOS minutes bill at 10x, but a release is rare and needs
# a Mac end to end (Swift build, icns, codesign, notarytool, ditto).
jobs:
  release:
    name: Build app & publish release
    runs-on: macos-15
    # Code signing and notarization switch on by themselves once the
    # secrets exist (Settings → Secrets and variables → Actions).
    # Always needed:
    #   MACOS_CERTIFICATE_P12      Developer ID Application cert, base64 of the .p12
    #   MACOS_CERTIFICATE_PASSWORD the .p12's password
    # Plus ONE way to talk to the notary service — either an App Store
    # Connect API key (Apple's recommended automation auth):
    #   APPLE_API_KEY_P8           the .p8 contents
    #   APPLE_API_KEY_ID           its Key ID
    #   APPLE_API_ISSUER_ID        the issuer UUID
    # …or a plain Apple ID with an app-specific password:
    #   APPLE_ID                   the account email
    #   APPLE_APP_SPECIFIC_PASSWORD  from account.apple.com
    #   APPLE_TEAM_ID              the 10-character team id
    # Until then the steps skip and the zip ships unsigned.
    env:
      # Xcode 26 for the Swift Build engine; see the Makefile and ci.yml.
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      HAVE_SIGNING: ${{ secrets.MACOS_CERTIFICATE_P12 != '' && (secrets.APPLE_API_KEY_P8 != '' || secrets.APPLE_APP_SPECIFIC_PASSWORD != '') }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Test before shipping
        run: make check

      - name: Build the app bundle and smoke-test it as installed
        # Unsigned here; the release signature (or the ad-hoc one when
        # there are no secrets) is applied below on the stamped bundle.
        run: make smoke-app

      - name: Stamp the tag's version into the bundle
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          plutil -replace CFBundleShortVersionString -string "$VERSION" dist/ClipChum.app/Contents/Info.plist
          plutil -replace CFBundleVersion -string "$VERSION" dist/ClipChum.app/Contents/Info.plist

      - name: Sign the app
        if: env.HAVE_SIGNING == 'true'
        env:
          CERT_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 900 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | awk -F'"' '/Developer ID Application/{print $2; exit}')
          test -n "$IDENTITY"
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          codesign --force --deep --options runtime --timestamp --sign "$IDENTITY" dist/ClipChum.app
          codesign --verify --deep --strict dist/ClipChum.app

      - name: Re-sign ad hoc (no signing secrets)
        if: env.HAVE_SIGNING != 'true'
        run: codesign --force --deep --sign - dist/ClipChum.app

      - name: Notarize and staple the app, then the disk image
        if: env.HAVE_SIGNING == 'true'
        env:
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          notarize() {
            if [ -n "$API_KEY_P8" ]; then
              echo "$API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
              xcrun notarytool submit "$1" \
                --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$API_KEY_ID" \
                --issuer "$API_ISSUER_ID" --wait
            else
              xcrun notarytool submit "$1" \
                --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" \
                --team-id "$APPLE_TEAM_ID" --wait
            fi
          }
          # The app first, so the copy inside the image carries its own ticket
          # and still opens offline once dragged out.
          ditto -c -k --keepParent dist/ClipChum.app "$RUNNER_TEMP/notarize.zip"
          notarize "$RUNNER_TEMP/notarize.zip"
          xcrun stapler staple dist/ClipChum.app
          DMG="ClipChum-${GITHUB_REF_NAME}.dmg"
          make dmg DMG="$DMG"
          codesign --force --timestamp --sign "$SIGN_IDENTITY" "$DMG"
          notarize "$DMG"
          xcrun stapler staple "$DMG"

      - name: Build the disk image (no signing secrets)
        if: env.HAVE_SIGNING != 'true'
        run: make dmg DMG="ClipChum-${GITHUB_REF_NAME}.dmg"

      - name: Smoke-test the bundle exactly as it ships
        run: make verify-app

      - name: Zip the bundle and checksum the downloads
        # ditto preserves the bundle structure and extended attributes
        # the way Archive Utility expects.
        run: |
          ditto -c -k --keepParent dist/ClipChum.app "ClipChum-${GITHUB_REF_NAME}.zip"
          for f in "ClipChum-${GITHUB_REF_NAME}.dmg" "ClipChum-${GITHUB_REF_NAME}.zip"; do
            shasum -a 256 "$f" > "$f.sha256"
          done

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$HAVE_SIGNING" = "true" ]; then
            MAC_NOTE="Signed and notarized — download the .dmg, open it, drag ClipChum.app to Applications and open it; it lives in the menu bar. Requires macOS 14+ on Apple Silicon."
          else
            MAC_NOTE="The app is not code-signed — on first launch, right-click ClipChum.app and choose Open (or clear quarantine with \`xattr -d com.apple.quarantine ClipChum.app\`); it lives in the menu bar. Requires macOS 14+ on Apple Silicon."
          fi
          gh release create "$GITHUB_REF_NAME" \
            --title "ClipChum $GITHUB_REF_NAME" \
            --generate-notes \
            --notes "$MAC_NOTE Accessibility access is only requested if you turn on \"Paste into the active app\" in Settings." \
            "ClipChum-${GITHUB_REF_NAME}.dmg" \
            "ClipChum-${GITHUB_REF_NAME}.dmg.sha256" \
            "ClipChum-${GITHUB_REF_NAME}.zip" \
            "ClipChum-${GITHUB_REF_NAME}.zip.sha256"
